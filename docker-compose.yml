services:
  postgres:
    image: postgres:16
    container_name: rawatin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rawatin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-this-password
    ports:
      - '5432:5432'
    volumes:
      - rawatin_pgdata:/var/lib/postgresql/data
volumes:
  rawatin_pgdata:
